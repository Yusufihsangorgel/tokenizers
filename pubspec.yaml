name: hf_tokenizers
description: >-
  HuggingFace tokenizers for Dart over FFI. Load any tokenizer.json and get
  byte-exact BPE, WordPiece, and Unigram encoding, backed by the Rust crate.
version: 1.2.4
repository: https://github.com/Yusufihsangorgel/tokenizers
topics:
  - llm
  - ai
  - tokenizer
  - ffi
  - nlp

# Kept on one double-quoted line each. A folded `>-` block turns an
# over-indented continuation into a literal newline, which is how the previous
# caption shipped a `\n` to pub.dev.
screenshots:
  - description: "A sentence on two rulers, each token span read as bytes and as string indices: one of six substring readings agrees, four return wrong text, and one throws."
    path: doc/offsets.png
  - description: "One sentence tokenized twice: the ids hf_tokenizers returns, and the three words a lowercase-and-look-up shortcut loses to the unknown token."
    path: doc/parity.png
  - description: "The example running: a BERT vocabulary of 30522, a byte-exact encode and decode round trip, then a 38-token document cut into 12-token chunks."
    path: doc/demo.gif

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  hooks: '>=2.0.2 <3.0.0'
  code_assets: '>=1.2.0 <3.0.0'
  # The build hook hashes each downloaded prebuilt. Every hooks 2.x release
  # already depends on crypto ^3.0.6, and consumers resolve no new package.
  crypto: ^3.0.6

dev_dependencies:
  # example/rag_chunking.dart only. Pure Dart with no runtime dependencies,
  # so it costs consumers nothing.
  rag_kit: ^1.0.2
  lints: ^6.0.0
  # Lower bounds that `dart pub downgrade` can build and run. test 1.25 and
  # 1.26 allow analyzer versions before 6.4, which allow watcher 1.0.0. That
  # watcher implements FileSystemEvent, which is sealed since Dart 3.1.
  test: ^1.27.0
  # The test_core version that package:test pins allows frontend_server_client
  # 3.2, which starts frontend_server.dart.snapshot. 64-bit SDKs ship only the
  # AOT snapshot.
  frontend_server_client: ^4.0.0
