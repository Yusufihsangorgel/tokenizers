name: hf_tokenizers
description: >-
  HuggingFace tokenizers for Dart over FFI. Load any tokenizer.json and get
  byte-exact BPE, WordPiece, and Unigram encoding, backed by the Rust crate.
version: 1.0.2
repository: https://github.com/Yusufihsangorgel/tokenizers
topics:
  - llm
  - ai
  - tokenizer
  - ffi
  - nlp

screenshots:
  - description: >-
      The example running: a BERT tokenizer reporting its 30522-token vocabulary
       and round-tripping "hello world" through encode and decode.
    path: doc/demo.gif

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  hooks: '>=2.0.2 <3.0.0'
  code_assets: ^1.2.0

dev_dependencies:
  # example/rag_chunking.dart only. Pure Dart with no runtime dependencies,
  # so it costs consumers nothing.
  rag_kit: ^1.0.2
  crypto: ^3.0.0
  lints: ^6.0.0
  test: ^1.25.0
