<svg xmlns="http://www.w3.org/2000/svg" width="720.0" height="300" viewBox="0 0 720.0 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<style>.lbl{font:600 13px ui-sans-serif,system-ui,sans-serif;fill:#57606a}.cnt{font:700 15px ui-sans-serif,system-ui,sans-serif}.tok{font:600 13px ui-monospace,monospace;fill:#0d1117}.box{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5;rx:5}.box2{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5;rx:5}.cut{stroke:#cf222e;stroke-width:2;stroke-dasharray:5 4}@media(prefers-color-scheme:dark){.lbl{fill:#8b949e}.tok{fill:#0d1117}}</style>
<text class="lbl" x="40.0" y="34">one word, tokenized</text>
<rect class="box" x="40.0" y="48.0" width="338.0" height="34" rx="5"/>
<text class="tok" x="209.0" y="70.0" text-anchor="middle">international</text>
<rect class="box" x="378.0" y="48.0" width="182.0" height="34" rx="5"/>
<text class="tok" x="469.0" y="70.0" text-anchor="middle">##ization</text>
<text class="cnt" x="680.0" y="70" text-anchor="end" fill="#1a7f37">2 tokens</text>
<line class="cut" x1="378.0" y1="40" x2="378.0" y2="180"/>
<text class="lbl" x="386.0" y="118" fill="#cf222e">chunk boundary</text>
<text class="lbl" x="40.0" y="172">same bytes, each piece encoded on its own</text>
<rect class="box" x="40.0" y="186.0" width="335.0" height="34" rx="5"/>
<text class="tok" x="207.5" y="208.0" text-anchor="middle">international</text>
<rect class="box2" x="388.0" y="186.0" width="88.0" height="34" rx="5"/>
<text class="tok" x="432.0" y="208.0" text-anchor="middle">i</text>
<rect class="box2" x="479.0" y="186.0" width="88.0" height="34" rx="5"/>
<text class="tok" x="523.0" y="208.0" text-anchor="middle">##zation</text>
<text class="cnt" x="680.0" y="208" text-anchor="end" fill="#cf222e">3 tokens</text>
<text class="lbl" x="40.0" y="262">The count you measured on the whole string is not a budget for its pieces.</text>
</svg>
