name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      # dart test copies the library the hook declares in its output.json and
      # sets the install name of the copy to the copy's absolute path. The copy
      # is in .dart_tool/lib up to Dart 3.13 and in a temporary directory that
      # is deleted on exit since 3.14, so this checks the declared file. A
      # 300-byte name only fits with the header padding from build.rs.
      - name: check room for a long install name
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: |
          shopt -s nullglob
          outputs=(.dart_tool/hooks_runner/hf_tokenizers/*/output.json)
          if [ "${#outputs[@]}" -ne 1 ]; then
            echo "expected one hook output.json, found ${#outputs[@]}" >&2
            exit 1
          fi
          if [ "$(plutil -extract assets raw -o - "${outputs[0]}")" != 1 ]; then
            echo "expected one asset in ${outputs[0]}" >&2
            exit 1
          fi
          lib=$(plutil -extract assets.0.encoding.file raw -o - "${outputs[0]}")
          echo "checking $lib"
          cp "$lib" "$RUNNER_TEMP/rename.dylib"
          install_name_tool -id "/$(printf 'x%.0s' {1..300})" "$RUNNER_TEMP/rename.dylib"

  binaries:
    name: binary (${{ matrix.asset }})
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libtokenizers_ffi.dylib
            asset: libtokenizers_ffi-macos-arm64.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            lib: libtokenizers_ffi.dylib
            asset: libtokenizers_ffi-macos-x64.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libtokenizers_ffi.so
            asset: libtokenizers_ffi-linux-x64.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: tokenizers_ffi.dll
            asset: tokenizers_ffi-windows-x64.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        working-directory: native/tokenizers_ffi
        run: cargo build --release --target ${{ matrix.target }}
      - name: stage asset
        shell: bash
        run: cp "native/tokenizers_ffi/target/${{ matrix.target }}/release/${{ matrix.lib }}" "${{ matrix.asset }}"
      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
