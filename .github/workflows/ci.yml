name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  binaries:
    name: binary (${{ matrix.asset }})
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libtokenizers_ffi.dylib
            asset: libtokenizers_ffi-macos-arm64.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            lib: libtokenizers_ffi.dylib
            asset: libtokenizers_ffi-macos-x64.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libtokenizers_ffi.so
            asset: libtokenizers_ffi-linux-x64.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: tokenizers_ffi.dll
            asset: tokenizers_ffi-windows-x64.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        working-directory: native/tokenizers_ffi
        run: cargo build --release --target ${{ matrix.target }}
      - name: stage asset
        shell: bash
        run: cp "native/tokenizers_ffi/target/${{ matrix.target }}/release/${{ matrix.lib }}" "${{ matrix.asset }}"
      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
